<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Um Dia de Safra</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,500..900&family=Inter:wght@400;500;600;700&display=swap">
<style>/* Um Dia de Safra v5 — um único visual: painel de operação escuro sobre a cena, acento verde Senior, sinal âmbar para ação. */
:root{
  color-scheme:dark;
  --noite:#071416; --vidro:rgba(7,20,22,.78); --vidro-2:rgba(7,20,22,.92); --linha:rgba(226,240,234,.18); --linha-2:rgba(226,240,234,.34);
  --claro:#eef6f1; --claro-2:rgba(238,246,241,.68); --claro-3:rgba(238,246,241,.4);
  --verde:#00b3a4; --verde-esc:#00877c; --ambar:#ffb629; --ambar-esc:#e29a0a; --erro:#ff7a5c; --ok:#5fe0c8;
  --f-titulo:'Archivo','Arial Narrow',system-ui,sans-serif; --f-texto:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gl:max(18px,env(safe-area-inset-left,0px)); --gr:max(18px,env(safe-area-inset-right,0px));
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sombra:0 0 2px rgba(0,0,0,.8),0 1px 6px rgba(0,0,0,.55);
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--noite);color:var(--claro);font-family:var(--f-texto);overflow:hidden;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;overflow:hidden;background:var(--noite);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app *{box-sizing:border-box}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui button{font-family:inherit;cursor:pointer}
#ui button:focus-visible,#ui input:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}
kbd{font:700 10px/1 var(--f-texto);border:1px solid var(--linha-2);border-radius:3px;padding:2px 5px;margin-left:6px;color:var(--claro-2)}

/* topo */
#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:16px;padding:calc(12px + var(--st)) var(--gr) 26px var(--gl);background:linear-gradient(180deg,rgba(4,12,14,.72),rgba(4,12,14,0));text-shadow:var(--sombra)}
.marca{display:flex;align-items:center;gap:10px;white-space:nowrap}
.marca i{width:4px;height:30px;background:var(--verde)}
.marca span{font:800 14px/1 var(--f-titulo);font-stretch:82%;letter-spacing:.18em;text-transform:uppercase}
.marca small{display:block;font:600 9.5px/1.3 var(--f-texto);letter-spacing:.16em;color:var(--claro-2);margin-top:5px}
#trilha{display:flex;gap:4px;flex:1;min-width:0;justify-content:center}
#trilha i{width:24px;height:4px;background:rgba(238,246,241,.22)}
#trilha i.ok{background:var(--verde)} #trilha i.now{background:var(--ambar)}
.dado{text-align:right;white-space:nowrap}
.dado b{display:block;font:800 24px/1 var(--f-titulo);font-stretch:78%;font-variant-numeric:tabular-nums}
.dado span{font:600 9px/1 var(--f-texto);letter-spacing:.18em;text-transform:uppercase;color:var(--claro-2)}
#btMenu{pointer-events:auto;background:var(--vidro);border:1px solid var(--linha);color:var(--claro);font:700 10px/1 var(--f-texto);padding:9px 12px;letter-spacing:.14em;text-transform:uppercase}
#btMenu:hover{border-color:var(--claro)}

/* objetivo */
#alvo{position:absolute;top:calc(74px + var(--st));left:var(--gl);width:min(290px,calc(100vw - var(--gl) - var(--gr)));padding:2px 0 2px 14px;border-left:2px solid var(--ambar);pointer-events:auto;text-shadow:var(--sombra)}
#alvo .hora{font:700 10.5px/1 var(--f-texto);letter-spacing:.2em;color:var(--ambar)}
#alvo h2{margin:7px 0 5px;font:800 23px/1.05 var(--f-titulo);font-stretch:80%;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
#alvo p{margin:0;font-size:12px;line-height:1.45;color:var(--claro-2)}
.linha-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bt{border:0;padding:11px 16px;font:700 12px/1 var(--f-texto);letter-spacing:.08em;text-transform:uppercase}
.bt-a{background:var(--ambar);color:#1c1403} .bt-a:hover{background:var(--ambar-esc)}
.bt-s{background:var(--vidro);color:var(--claro);border:1px solid var(--linha-2);text-shadow:none} .bt-s:hover{border-color:var(--claro)}
.bt-c{background:transparent;color:var(--claro);border:1px solid var(--linha)} .bt-c:hover{border-color:var(--claro)}
#alvo .bt{padding:8px 10px;font-size:10.5px}

/* mira e chamada de interação */
#mira{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
#fala{position:absolute;left:50%;top:60%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;pointer-events:auto;white-space:nowrap;text-shadow:var(--sombra)}
#fala .anel{position:relative;width:48px;height:48px;flex:none}
#fala svg{width:48px;height:48px}
#fala circle{fill:none;stroke-width:3}
#fala .bg{stroke:rgba(238,246,241,.28);fill:rgba(7,20,22,.55)} #fala .fg{stroke:var(--ambar);stroke-dasharray:125.7;stroke-dashoffset:125.7}
#fala .anel span{position:absolute;inset:0;display:grid;place-items:center;font:800 19px/1 var(--f-titulo)}
#fala .rot{background:var(--vidro);border-left:2px solid var(--ambar);padding:8px 12px 7px}
#fala .rot b{display:block;font:700 14px/1.2 var(--f-titulo);font-stretch:88%;letter-spacing:.08em;text-transform:uppercase}
#fala .rot small{display:block;font:500 11px/1.3 var(--f-texto);color:var(--claro-2);margin-top:2px}
body:not(.toque) #btFala{display:none}
body.toque #fala .anel span{font-size:0}

/* cartão de local */
#local{position:absolute;left:max(var(--gl),6vw);bottom:calc(30vh + var(--sb));padding-left:16px;opacity:0;transition:opacity .5s;text-shadow:var(--sombra)}
#local i{position:absolute;left:0;top:2px;bottom:2px;width:3px;background:var(--verde)}
#local b{display:block;font:800 clamp(24px,4vw,46px)/1 var(--f-titulo);font-stretch:78%;letter-spacing:.14em;text-transform:uppercase}
#local span{display:block;margin-top:8px;font:600 11px/1.4 var(--f-texto);letter-spacing:.16em;text-transform:uppercase;color:var(--claro-2)}
@keyframes entra{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -2% 0 0)}}
#local.on{opacity:1} #local.on b{animation:entra 1s steps(26,end) both}

#ajuda{position:absolute;left:var(--gl);bottom:calc(14px + var(--sb));font:500 10.5px/1 var(--f-texto);letter-spacing:.06em;color:var(--claro-2);text-shadow:var(--sombra)}
body:not(.jogo) #top{display:none}
body.falando #alvo,body.falando #ajuda,body.falando #bussola,body.falando #fala{display:none}
#mapa{display:none!important;position:absolute;right:var(--gr);bottom:calc(14px + var(--sb));width:min(280px,40vw);aspect-ratio:230/110;background:var(--vidro);border:1px solid var(--linha);opacity:.9}
#avisos{position:absolute;top:calc(104px + var(--st));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.aviso{background:var(--vidro-2);border-left:2px solid var(--ambar);color:var(--claro);font:600 12px/1.3 var(--f-texto);letter-spacing:.04em;padding:8px 14px;animation:some 3s forwards;text-align:center}
@keyframes some{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
#vinha{display:none}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,182,41,.5),rgba(255,182,41,0) 62%);opacity:0;transition:opacity .8s}
#pontos.pulso{animation:pulso .45s}
@keyframes pulso{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.seg{display:flex;gap:0;margin-top:6px;flex-wrap:wrap}
.seg button{padding:8px 13px;border:1px solid var(--linha-2);margin-right:-1px;background:transparent;color:var(--claro-2);font:700 11px var(--f-texto);letter-spacing:.06em;text-transform:uppercase}
.seg button.on{background:var(--verde-esc);color:#fff;border-color:var(--verde-esc)}

#bussola{position:absolute;top:calc(62px + var(--st));left:50%;transform:translateX(-50%);pointer-events:none}
#radio{position:absolute;left:50%;bottom:calc(58px + var(--sb));transform:translateX(-50%);background:var(--vidro-2);border-left:2px solid var(--verde);padding:9px 14px;font:500 12.5px/1.45 var(--f-texto);max-width:min(560px,calc(100vw - 24px));opacity:0;transition:opacity .4s;pointer-events:none}
#radio b{color:var(--verde);font-weight:700;letter-spacing:.14em;margin-right:10px;font-size:10px}
#medicao{position:absolute;top:calc(210px + var(--st));left:var(--gl);background:var(--vidro-2);border:1px solid var(--linha);font:11px/1.55 ui-monospace,Menlo,monospace;color:var(--claro);padding:8px 10px;pointer-events:auto;white-space:pre;z-index:5}
#medicao button{margin-top:6px;padding:4px 8px;font:700 10px var(--f-texto)}
.ajuste{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin-top:10px;font-size:13px}
.ajuste input[type=range]{width:150px;accent-color:var(--verde)}
.barra{margin-top:10px}.barra .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:600}.barra .faixa{height:6px;background:rgba(238,246,241,.14);margin-top:4px}.barra .faixa i{display:block;height:100%;background:var(--verde)}
@media (max-width:720px){#bussola{display:none}}

/* joystick */
#manche{position:absolute;left:calc(8px + var(--gl));bottom:calc(20px + var(--sb));width:112px;height:112px;border-radius:50%;border:1.5px solid rgba(238,246,241,.5);background:rgba(6,20,22,.3);pointer-events:auto;touch-action:none}
#manche i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(238,246,241,.5)}
body:not(.toque) #manche{display:none} body.toque #ajuda{display:none}

/* painéis: conversa (embaixo, a cena continua visível), central (plataforma, relatório, pausa) e título */
.veu{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:calc(12px + var(--st)) var(--gr) calc(18px + var(--sb)) var(--gl);pointer-events:none;-webkit-user-select:text;user-select:text}
.veu .folha{pointer-events:auto}
.veu.meio{align-items:center;justify-content:center;background:rgba(4,12,14,.72);pointer-events:auto;backdrop-filter:blur(6px)}
.folha{background:var(--vidro-2);color:var(--claro);width:100%;max-width:540px;max-height:min(100%,78vh);overflow:auto;border-left:2px solid var(--verde);padding:18px 20px 20px;backdrop-filter:blur(8px)}
.veu.meio .folha{max-width:760px;max-height:100%;border-left:0;border-top:2px solid var(--verde);background:rgba(8,24,26,.94)}
.folha .olho{font:700 10.5px/1.3 var(--f-texto);letter-spacing:.18em;text-transform:uppercase;color:var(--verde)}
.folha h2{margin:8px 0 10px;font:800 25px/1.08 var(--f-titulo);font-stretch:82%;letter-spacing:.02em;text-wrap:balance}
.folha h3{margin:18px 0 6px;font:700 10.5px/1.3 var(--f-texto);letter-spacing:.18em;text-transform:uppercase;color:var(--claro-2)}
.folha p{margin:0 0 8px;font-size:14px;line-height:1.5;max-width:65ch}
.folha .nota{font-size:12px;color:var(--claro-2)}
.cena{margin:10px 0;padding:10px 14px;background:rgba(238,246,241,.06);border-left:2px solid var(--claro-3);font-size:14px;line-height:1.5}
.op{display:block;width:100%;text-align:left;margin-top:6px;padding:11px 13px;background:rgba(238,246,241,.05);border:1px solid var(--linha);color:var(--claro)}
.op b{display:block;font:600 13.5px/1.35 var(--f-texto)} .op span{display:block;font-size:12px;color:var(--claro-2);margin-top:2px}
.op:hover:not(:disabled){border-color:var(--ambar);background:rgba(255,182,41,.08)}
.op.nao{border-color:var(--erro);opacity:.85} .op.nao span{color:var(--erro);margin-top:5px}
.op.sim{border-color:var(--ok);background:rgba(95,224,200,.1)}
.frente{margin-top:10px;padding:11px 13px;border:1px solid var(--linha);background:rgba(238,246,241,.04)}
.frente .cab{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.frente .cab b{font:800 15px/1.2 var(--f-titulo);font-stretch:86%;letter-spacing:.03em}
.selo{font:700 9.5px/1 var(--f-texto);letter-spacing:.12em;text-transform:uppercase;background:var(--verde-esc);color:#fff;padding:5px 7px;white-space:nowrap}
.selo.off{background:rgba(238,246,241,.16);color:var(--claro-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chips span{font-size:11px;line-height:1.2;padding:4px 7px;background:rgba(238,246,241,.08);color:var(--claro)}
.chips em{font-style:normal;font-weight:700;font-size:11px;padding:4px 0;color:var(--ok);flex-basis:100%}
.levar{margin-top:10px;padding:11px 14px;background:rgba(0,179,164,.14);border-left:2px solid var(--verde);font-size:14px;line-height:1.45}
.levar small{display:block;font:700 9.5px/1.3 var(--f-texto);letter-spacing:.16em;text-transform:uppercase;color:var(--verde);margin-bottom:4px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.grade .frente{margin:0} .frente.fechada{opacity:.5} .frente.fechada .chips{display:none}
table.dia{width:100%;border-collapse:collapse;font-size:13px}
table.dia td{padding:7px 8px 7px 0;border-top:1px solid var(--linha);vertical-align:top} table.dia td:first-child{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;color:var(--ambar)}
#copia{width:100%;min-height:90px;margin-top:8px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--claro);background:rgba(0,0,0,.3);border:1px solid var(--linha);padding:8px}
label.campo{display:block;font:700 10px/1 var(--f-texto);letter-spacing:.16em;text-transform:uppercase;color:var(--claro-2);margin-top:12px}
label.campo input{display:block;margin-top:6px;width:min(260px,100%);padding:9px 10px;font:600 14px var(--f-texto);border:1px solid var(--linha-2);background:rgba(0,0,0,.3);color:var(--claro)}

/* título */
.veu.titulo{align-items:center;justify-content:flex-start;pointer-events:auto;padding-left:max(var(--gl),6vw);background:linear-gradient(90deg,rgba(4,12,14,.88) 0%,rgba(4,12,14,.62) 38%,rgba(4,12,14,0) 72%);backdrop-filter:none}
.veu.titulo .folha{background:transparent;border:0;padding:0;max-width:560px;backdrop-filter:none;overflow:visible}
.t-eyebrow{font:700 11px/1.3 var(--f-texto);letter-spacing:.24em;text-transform:uppercase;color:var(--verde)}
.t-word{margin:14px 0 16px;font:900 clamp(52px,9vw,124px)/.88 var(--f-titulo);font-stretch:76%;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 2px 30px rgba(0,0,0,.5)}
.t-prem{font-size:15px!important;line-height:1.55!important;color:var(--claro);max-width:46ch!important;border-top:1px solid var(--linha-2);padding-top:14px}
.t-form{display:flex;gap:22px;flex-wrap:wrap}
.veu.titulo .linha-b{margin-top:22px}
.veu.titulo .bt{padding:15px 22px;font-size:13px}

#carga{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--noite);transition:opacity .6s;pointer-events:auto;text-align:center;padding:0 24px;z-index:50}
#carga b{font:900 clamp(34px,8vw,84px)/1 var(--f-titulo);font-stretch:76%;letter-spacing:.14em;text-transform:uppercase}
#carga span{font:600 11px/1.4 var(--f-texto);letter-spacing:.2em;text-transform:uppercase;color:var(--claro-2)}
.barra-c{width:min(320px,70vw);height:2px;background:rgba(238,246,241,.14)} .barra-c i{display:block;height:100%;width:8%;background:var(--verde);transition:width .3s}
@media (max-width:720px){
  .marca small{display:none} #trilha i{width:12px} #alvo{top:calc(64px + var(--st))} #alvo h2{font-size:18px}
  #mapa{display:none} .folha{padding:14px 14px 16px} .folha h2{font-size:20px} .veu{padding-left:10px;padding-right:10px}
  .veu.titulo{background:rgba(4,12,14,.7);padding-left:18px}
}
@media (max-height:560px){.t-word{font-size:clamp(34px,13vh,72px);margin:8px 0 10px}.t-prem{display:none}.veu.titulo .linha-b{margin-top:12px}.folha{max-height:92vh}}
@media (prefers-reduced-motion:reduce){.aviso{animation-timing-function:step-end}#local.on b{animation:none}}
</style></head><body>
<div id="app">
  <canvas id="view" tabindex="0" aria-label="Fazenda e indústria em 3D"></canvas>
  <div id="ui">
    <div id="top">
      <div class="marca"><i></i><span>Um Dia de Safra<small>Senior · Agro · Usina Horizonte</small></span></div>
      <div id="trilha" aria-hidden="true"></div>
      <div class="dado"><b id="relogio">05:30</b><span>hora do dia</span></div>
      <div class="dado"><b id="pontos">0</b><span id="pontosLbl">pontos</span></div>
      <button id="btMenu" hidden>Pausa</button>
    </div>
    <div id="alvo" hidden>
      <div class="hora" id="alvoHora"></div>
      <h2 id="alvoNome"></h2>
      <p id="alvoDica"></p>
      <div class="linha-b">
        <button class="bt bt-s" id="btIr">Ir até lá <kbd>G</kbd></button>
        <button class="bt bt-s" id="btPlat">Plataforma <kbd>M</kbd></button>
      </div>
    </div>
    <div id="mira" hidden></div>
    <div id="fala" hidden>
      <div class="anel"><svg viewBox="0 0 48 48" aria-hidden="true"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" id="falaAnel" cx="24" cy="24" r="20" transform="rotate(-90 24 24)"/></svg><span>E</span></div>
      <div class="rot"><b id="falaTxt"></b><small id="falaSub"></small></div>
      <button class="bt bt-a" id="btFala">Conversar</button>
    </div>
    <div id="local" aria-live="polite"><i></i><b id="localNome"></b><span id="localSub"></span></div>
    <div id="ajuda" hidden>WASD anda · mouse olha · Shift corre · E interage · G vai até a parada · M plataforma · P pausa</div>
    <canvas id="mapa" width="460" height="220" hidden aria-hidden="true"></canvas>
    <div id="manche" hidden><i></i></div>
    <div id="avisos" aria-live="polite"></div>
    <div id="vinha" aria-hidden="true"></div>
    <div id="flash" aria-hidden="true"></div>
    <canvas id="bussola" width="340" height="30" hidden aria-hidden="true"></canvas>
    <div id="radio" aria-live="polite"><b>RÁDIO · CENTRO DE OPERAÇÕES</b><span id="radioTxt"></span></div>
    <div id="medicao" hidden><span id="medTxt"></span><br><button id="btMedCop">copiar medição</button></div>
    <div class="veu meio" id="pausaVeu" hidden><div class="folha" id="pausaFolha" role="dialog" aria-modal="true"></div></div>
    <div class="veu" id="veu" hidden><div class="folha" id="folha" role="dialog" aria-modal="true"></div></div>
    <div id="carga"><b>Um Dia de Safra</b><span id="cargaStatus">Montando a operação…</span><div class="barra-c"><i id="cargaFill"></i></div></div>
